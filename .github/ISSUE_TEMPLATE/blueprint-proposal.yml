name: Blueprint Proposal
description: Propose a blueprint you intend to contribute
title: "[Blueprint Proposal]: "
body:
  - type: input
    id: name
    attributes:
      label: Proposed blueprint name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: What real-world problem does it solve, and who will use it?
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Proposed agent flow
      description: Outline the inputs, reasoning, actions, and result.
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails and permissions
      description: Describe data access, allowed actions, approval boundaries, and actions that must never be automatic.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution plan
      description: How do you plan to demonstrate and test the blueprint?
    validations:
      required: true
