name: Azure Deployment Investigator
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Use synthetic evidence without Azure login (still uses GitHub Models)
        type: boolean
        default: true
      resource_group:
        description: Resource group (required for live mode)
        type: string
      deployment_name:
        description: Deployment name (required for live mode)
        type: string
permissions:
  contents: read
  id-token: write
  models: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Azure OIDC login (Reader role only)
        if: inputs.sample == false
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Collect initial evidence
        id: prepare
        run: node scripts/blueprints/azure.mjs prepare
        env:
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          SAMPLE: ${{ inputs.sample }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
      - name: Plan one read-only diagnostic
        id: plan
        uses: actions/ai-inference@v1
        with:
          model: ${{ vars.BLUEPRINT_MODEL || 'openai/gpt-4o' }}
          max-tokens: 500
          system-prompt-file: ${{ steps.prepare.outputs.folder }}/system.txt
          prompt-file: ${{ steps.prepare.outputs.folder }}/prompt.txt
      - name: Validate plan and execute fixed diagnostic
        run: node scripts/blueprints/azure.mjs followup
        env:
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          MODEL_RESPONSE_FILE: ${{ steps.plan.outputs.response-file }}
      - name: Evaluate diagnostic result
        id: evaluate
        uses: actions/ai-inference@v1
        with:
          model: ${{ vars.BLUEPRINT_MODEL || 'openai/gpt-4o' }}
          max-tokens: 2500
          system-prompt-file: ${{ steps.prepare.outputs.folder }}/system.txt
          prompt-file: ${{ steps.prepare.outputs.folder }}/prompt.txt
      - name: Validate and publish advisory
        run: node scripts/blueprints/azure.mjs report
        env:
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          MODEL_RESPONSE_FILE: ${{ steps.evaluate.outputs.response-file }}
      - uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-investigator-report
          path: |
            ${{ steps.prepare.outputs.folder }}/report.md
            ${{ steps.prepare.outputs.folder }}/report.json
          retention-days: 7
          if-no-files-found: error
