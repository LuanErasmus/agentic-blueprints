name: Bounded blueprint runner

on:
  workflow_call:
    inputs:
      blueprint:
        required: true
        type: string
      number:
        default: ''
        type: string
      sample:
        default: false
        type: boolean
      base_ref:
        default: ''
        type: string
      head_ref:
        default: ''
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  models: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted blueprint code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect initial evidence
        id: prepare
        run: node scripts/blueprints/run.mjs prepare "$BLUEPRINT"
        env:
          BLUEPRINT: ${{ inputs.blueprint }}
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          SAMPLE: ${{ inputs.sample }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}

      - name: Select a bounded follow-up
        id: plan
        if: steps.prepare.outputs.enabled == 'true'
        uses: actions/ai-inference@v1
        with:
          model: ${{ vars.BLUEPRINT_MODEL || 'openai/gpt-4o' }}
          max-tokens: 500
          system-prompt-file: ${{ steps.prepare.outputs.folder }}/system.txt
          prompt-file: ${{ steps.prepare.outputs.folder }}/prompt.txt

      - name: Validate decision and collect selected evidence
        if: steps.prepare.outputs.enabled == 'true'
        run: node scripts/blueprints/run.mjs followup "$BLUEPRINT"
        env:
          BLUEPRINT: ${{ inputs.blueprint }}
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_RESPONSE_FILE: ${{ steps.plan.outputs.response-file }}

      - name: Evaluate evidence and produce a recommendation
        id: evaluate
        if: steps.prepare.outputs.enabled == 'true'
        uses: actions/ai-inference@v1
        with:
          model: ${{ vars.BLUEPRINT_MODEL || 'openai/gpt-4o' }}
          max-tokens: 2500
          system-prompt-file: ${{ steps.prepare.outputs.folder }}/system.txt
          prompt-file: ${{ steps.prepare.outputs.folder }}/prompt.txt

      - name: Validate and publish run summary
        if: steps.prepare.outputs.enabled == 'true'
        run: node scripts/blueprints/run.mjs report "$BLUEPRINT"
        env:
          BLUEPRINT: ${{ inputs.blueprint }}
          BLUEPRINT_OUTPUT: ${{ runner.temp }}/blueprints
          MODEL_RESPONSE_FILE: ${{ steps.evaluate.outputs.response-file }}

      - name: Save advisory report
        if: steps.prepare.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.blueprint }}-report
          path: |
            ${{ steps.prepare.outputs.folder }}/report.md
            ${{ steps.prepare.outputs.folder }}/report.json
          retention-days: 7
          if-no-files-found: error
