name: GitHub Issue Triage
on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number (required for live mode)
        type: string
      sample:
        description: Use synthetic evidence (still uses GitHub Models)
        type: boolean
        default: true
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  models: read
jobs:
  triage:
    uses: ./.github/workflows/blueprint-runner.yml
    with:
      blueprint: github-issue-triage
      number: ${{ inputs.number || '' }}
      sample: ${{ inputs.sample || false }}
