name: GitHub PR Review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      number:
        description: PR number (required for live mode)
        type: string
      sample:
        description: Use synthetic evidence (still uses GitHub Models)
        type: boolean
        default: true
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  models: read
jobs:
  review:
    uses: ./.github/workflows/blueprint-runner.yml
    with:
      blueprint: github-pr-review
      number: ${{ inputs.number || '' }}
      sample: ${{ inputs.sample || false }}
