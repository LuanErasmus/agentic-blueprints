name: Release Readiness Helper
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Release tracking issue number (required for live mode)
        type: string
      sample:
        description: Use synthetic evidence (still uses GitHub Models)
        type: boolean
        default: true
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  models: read
jobs:
  assess:
    uses: ./.github/workflows/blueprint-runner.yml
    with:
      blueprint: release-readiness-helper
      number: ${{ inputs.number || '' }}
      sample: ${{ inputs.sample || false }}
