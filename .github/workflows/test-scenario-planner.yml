name: Test Scenario Planner
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number (required for live mode)
        type: string
      sample:
        description: Use synthetic evidence (still uses GitHub Models)
        type: boolean
        default: true
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  models: read
jobs:
  plan:
    uses: ./.github/workflows/blueprint-runner.yml
    with:
      blueprint: test-scenario-planner
      number: ${{ inputs.number || '' }}
      sample: ${{ inputs.sample || false }}
