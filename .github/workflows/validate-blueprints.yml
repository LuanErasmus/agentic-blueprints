name: Validate blueprint examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/blueprints/blueprints.test.mjs
      - name: Install the source-validation compiler
        run: gh extension install github/gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate gh-aw sources without generating lock files
        run: node scripts/blueprints/validate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
